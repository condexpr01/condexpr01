name: update-png

on:
  workflow_dispatch:
  schedule:
    - cron: '39 1 * * 1'
  #issues:
  #  types: [opened]
  #pull_request_target:
  #  types: [opened]
  #fork:
  #watch:
  #  types: [started]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    name: regen
    steps:

      - name: checkout
        uses: actions/checkout@v7

      - name: run make
        run: |
          make update-png;make clean

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[ci/cd-bot: update]"


