name: update-png

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    name: regen
    steps:

      - name: checkout
        uses: actions/checkout@v2

      - name: run make
        run: |
          make update-png;make clean

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[ci/cd-bot: update]"


